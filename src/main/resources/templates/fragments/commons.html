<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:fragment="header">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kids Paradise</title>
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/reset-css.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>

    </th:block>
</head>
<body>
<th:block th:fragment="navigation">
    <div class="container-fluid banner">
        <div class="row">
            <div class="col-md-12">
                <nav class="navbar navbar-md">
                    <a class="navbar-brand" href="/home">Kids Paradise</a>

                    <ul class="nav">

                        <li class="nav-item">
                            <a class="nav-link" href="/home">HOME</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/about">ABOUT</a>
                        </li>


                        <li class="nav-item">
                            <a class="nav-link" href="/products">PRODUCTS</a>
                        </li>


                        <li class="nav-item">
                            <a class="nav-link" href="/contact">CONTACT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/register">REGISTER</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/login">LOGIN</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/add-product">ADD PRODUCT</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin">ADMIN</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/profile">PROFILE</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/my-cart">CART</a>
                        </li>

                        <form th:method="POST" th:action="@{/logout}" sec:authorize="isAuthenticated()">
                            <input class="btn btn-light " type="submit" value="LOG OUT">
                        </form>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="footer">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
            integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
            crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
    <footer class="footer bg-transparent  py-2">
        <div class="container-fluid text-center">
            <div class="footer-background h5 text-dark fixed-bottom">
                &copy; Nikolay Ivanov - SoftUni Student 2023. All rights reserved.
            </div>
        </div>
    </footer>
</th:block>
</body>
</html>
