                               <a class="nav-link" href="#">PRODUCTS</a>

                          </li>
                      <li class="nav-item">

<form method=""
      class="main-form mx-auto col-md-3 my-5 d-flex flex-column justify-content-center">
    <div class="form-group">
        <label for="username" class="text-black font-weight-bold">Username</label>
        <input id="username" name="username" type="text"
               class="form-control" placeholder="Username" />
    </div>
    <div class="form-group">
        <label for="password" class="text-black font-weight-bold">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               placeholder="Password" />
    </div>

    <p class="errors alert alert-danger">
        Invalid username or password.
    </p>



    <div class="for-row">
        <div class="col col-md-4">
            <button type="submit" class="btn1 mt-3 mb-4">Login</button>
        </div>


        <p><strong>Don't have an account? </strong><a href="#">Register here</a></p>
    </div>
</form>
